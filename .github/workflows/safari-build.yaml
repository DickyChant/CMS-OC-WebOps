name: Browser Builds

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  chromium-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Package Chromium extensions
        run: |
          mkdir -p chromium_packages
          PACKAGES_DIR=$(pwd)/chromium_packages
          for ext_dir in extensions/*/; do
            ext_name=$(basename "$ext_dir")
            (cd "$ext_dir" && zip -r "${PACKAGES_DIR}/${ext_name}_chromium.zip" .)
          done

      - name: Upload Chromium extension packages
        uses: actions/upload-artifact@v4
        with:
          name: chromium-extensions
          path: chromium_packages/*.zip
          if-no-files-found: error

  firefox-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Build Firefox extensions
        run: |
          mkdir -p firefox_packages
          for ext_dir in firefox/*_firefox/; do
            ext_name=$(basename "$ext_dir")
            web-ext build \
              --source-dir "$ext_dir" \
              --artifacts-dir firefox_packages \
              --filename "${ext_name}.zip" \
              --overwrite-dest
          done

      - name: Upload Firefox extension packages
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extensions
          path: firefox_packages/*.zip
          if-no-files-found: error

  safari-build:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Convert extensions to Safari Web Extensions
        run: |
          mkdir -p safari_builds
          for ext_dir in extensions/*/; do
            ext_name=$(basename "$ext_dir")
            xcrun safari-web-extension-converter "$ext_dir" \
              --project-location "safari_builds" \
              --app-name "${ext_name}" \
              --bundle-identifier "com.cms.webops.${ext_name}" \
              --no-prompt \
              --force
          done

      - name: Package Safari extensions
        run: |
          mkdir -p safari_packages
          for project_dir in safari_builds/*/; do
            ext_name=$(basename "$project_dir")
            zip -r "safari_packages/${ext_name}_safari.zip" "$project_dir"
          done

      - name: Upload Safari extension packages
        uses: actions/upload-artifact@v4
        with:
          name: safari-extensions
          path: safari_packages/*.zip
          if-no-files-found: error
